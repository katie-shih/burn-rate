# The oxblood theme. These values mirror burnrate/theme.py, which is the
# source of truth — Streamlit needs them here because it paints the page
# shell before any Python runs, so it cannot read them from the module.
#
# If you change a colour, change it in burnrate/theme.py, copy it here, and
# then run:
#
#     uv run python scripts/check_palette.py
#
# That script checks every series colour is still tellable apart (including
# by colourblind readers) and that everything still has enough contrast
# against this background. It is not a formality: run against the previous
# light theme it found eight real failures.

[theme]
base = "dark"
backgroundColor = "#5d2627"          # PAGE
secondaryBackgroundColor = "#672b2c" # SURFACE
textColor = "#efeae0"                # INK
primaryColor = "#ece8d7"             # ACCENT
font = "sans-serif"                  # the real face is vendored; see theme.py

[browser]
gatherUsageStats = false
